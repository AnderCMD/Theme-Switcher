<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Switcher — All Variants</title>
    <link rel="stylesheet" href="../../src/styles/index.css" />
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
        background: #fafafa;
        color: #111;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }
      html.dark body {
        background: #0f1115;
        color: #f2f2f2;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1.5rem;
        margin-top: 2rem;
      }
      .card {
        border: 1px solid rgba(128, 128, 128, 0.25);
        border-radius: 0.75rem;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .card h2 {
        font-size: 0.95rem;
        margin: 0;
      }
      code {
        font-size: 0.8rem;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <h1>Theme Switcher</h1>
    <p>All 30 built-in variants, wired to the same shared theme. Click any of them.</p>

    <div class="grid" id="grid"></div>

    <script type="module">
      import { mountThemeSwitch, ThemeController, VARIANT_IDS } from '../../src/vanilla/index.ts';

      // Share a single controller so every card stays in sync.
      const controller = new ThemeController();
      const grid = document.getElementById('grid');

      for (const variant of VARIANT_IDS) {
        const card = document.createElement('div');
        card.className = 'card';

        const title = document.createElement('h2');
        title.textContent = variant;

        const codeEl = document.createElement('code');
        codeEl.textContent = `variant: '${variant}'`;

        const mountPoint = document.createElement('div');

        card.append(title, mountPoint, codeEl);
        grid.append(card);

        mountThemeSwitch(mountPoint, { variant, controller });
      }
    </script>
  </body>
</html>
